name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Build-only for non-main branches, PRs, and manual dispatch
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bearapp-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  # Auto-increment version, build, tag, and release on every main push
  auto-release:
    name: Auto Version, Build & Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Auto-increment versionCode
        id: version
        run: |
          VERSION_NAME=$(grep -oP '(?<=versionName ")([^"]+)' app/build.gradle)
          VERSION_CODE=$(grep -oP '(?<=versionCode )\d+' app/build.gradle)
          NEW_CODE=$((VERSION_CODE + 1))
          TAG="v${VERSION_NAME}.${NEW_CODE}"
          sed -i "s/versionCode ${VERSION_CODE}/versionCode ${NEW_CODE}/" app/build.gradle
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "NEW_CODE=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "Version: ${TAG}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: bump versionCode to ${{ steps.version.outputs.NEW_CODE }} [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Rename APK
        run: |
          APK_SRC=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          mv "$APK_SRC" "app/build/outputs/apk/release/bearapp-${{ steps.version.outputs.TAG }}.apk"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="-20"
          fi
          COMMITS=$(git log --pretty=format:"- %s" $RANGE \
            | grep -Ev "chore: bump versionCode|\[skip ci\]" \
            || echo "- อัปเดตระบบภายใน")
          if [ -z "$COMMITS" ]; then
            COMMITS="- อัปเดตระบบภายใน"
          fi
          {
            echo "NOTES<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Get APK info
        id: apk_info
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -name "bearapp-*.apk" | head -1)
          APK_SIZE=$(du -h "$APK_FILE" | awk '{print $1}')
          echo "APK_SIZE=${APK_SIZE}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.TAG }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "${{ steps.version.outputs.TAG }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "BearApp ${{ steps.version.outputs.TAG }}"
          body: |
            ## BearApp ${{ steps.version.outputs.TAG }}

            ### การเปลี่ยนแปลง
            ${{ steps.changelog.outputs.NOTES }}

            ---

            ### ดาวน์โหลด
            กดที่ไฟล์ `.apk` ด้านล่างเพื่อดาวน์โหลด
            > ขนาดไฟล์: ${{ steps.apk_info.outputs.APK_SIZE }}

            ### วิธีติดตั้ง
            1. ดาวน์โหลดไฟล์ `.apk`
            2. เปิดไฟล์และอนุญาตการติดตั้งจากแหล่งที่ไม่รู้จัก
            3. กด "ติดตั้ง"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/bearapp-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
