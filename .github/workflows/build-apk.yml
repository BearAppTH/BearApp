name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build-only for non-main branches, PRs, and manual dispatch
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/bearstore-release.jks
            echo "KEYSTORE_FILE=/tmp/bearstore-release.jks" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bearapp-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  # Auto version bump, build, and release on every main push or manual dispatch
  auto-release:
    name: Auto Version, Build & Release
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')))
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute next SemVer version
        id: version
        run: |
          # Find the latest 3-part tag (vX.Y.Z), ignore old 4-part tags
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LATEST_TAG" ]; then
            # No 3-part tag yet — use versionName from build.gradle as base
            BASE=$(grep -oP '(?<=versionName ")([^"]+)' app/build.gradle)
            LATEST_TAG="v${BASE}"
            echo "No 3-part tag found, using build.gradle base: ${LATEST_TAG}"
          fi

          VERSION_BODY="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION_BODY" | cut -d. -f1)
          MINOR=$(echo "$VERSION_BODY" | cut -d. -f2)
          PATCH=$(echo "$VERSION_BODY" | cut -d. -f3)

          # Increment patch; when patch would exceed 9, bump minor and reset patch
          NEW_PATCH=$((PATCH + 1))
          NEW_MINOR=$MINOR
          NEW_MAJOR=$MAJOR
          if [ "$NEW_PATCH" -gt 9 ]; then
            NEW_PATCH=0
            NEW_MINOR=$((MINOR + 1))
          fi
          if [ "$NEW_MINOR" -gt 9 ]; then
            NEW_MINOR=0
            NEW_MAJOR=$((MAJOR + 1))
          fi

          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          # versionCode = total number of releases + 1 (monotonically increasing)
          NEW_CODE=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | wc -l)
          NEW_CODE=$((NEW_CODE + 1))

          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "NEW_TAG=${NEW_TAG}"         >> $GITHUB_OUTPUT
          echo "NEW_CODE=${NEW_CODE}"       >> $GITHUB_OUTPUT
          echo "Bumping ${LATEST_TAG} → ${NEW_TAG} (versionCode ${NEW_CODE})"

      - name: Update build.gradle with new version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.NEW_CODE }}/" app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.version.outputs.NEW_VERSION }}"/' app/build.gradle
          echo "build.gradle updated:"
          grep -E 'versionCode|versionName' app/build.gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/bearstore-release.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          KEYSTORE_FILE: /tmp/bearstore-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          APK_SRC=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          mv "$APK_SRC" "app/build/outputs/apk/release/bearapp-${{ steps.version.outputs.NEW_TAG }}.apk"

      - name: Commit version bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: bump version to ${{ steps.version.outputs.NEW_VERSION }} [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="-20"
          fi
          COMMITS=$(git log --pretty=format:"- %s" $RANGE \
            | grep -Ev "chore: bump version|\[skip ci\]" \
            || echo "- อัปเดตระบบภายใน")
          if [ -z "$COMMITS" ]; then
            COMMITS="- อัปเดตระบบภายใน"
          fi
          {
            echo "NOTES<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Get APK size
        id: apk_info
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -name "bearapp-*.apk" | head -1)
          APK_SIZE=$(du -h "$APK_FILE" | awk '{print $1}')
          echo "APK_SIZE=${APK_SIZE}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.NEW_TAG }}" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "${{ steps.version.outputs.NEW_TAG }}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.NEW_TAG }}
          name: "Bear Store ${{ steps.version.outputs.NEW_TAG }}"
          body: |
            ## Bear Store ${{ steps.version.outputs.NEW_TAG }}

            ### การเปลี่ยนแปลง
            ${{ steps.changelog.outputs.NOTES }}

            ---

            ### ดาวน์โหลด
            กดที่ไฟล์ `.apk` ด้านล่างเพื่อดาวน์โหลด
            > ขนาดไฟล์: ${{ steps.apk_info.outputs.APK_SIZE }}

            ### วิธีติดตั้ง
            1. ดาวน์โหลดไฟล์ `.apk`
            2. เปิดไฟล์และอนุญาตการติดตั้งจากแหล่งที่ไม่รู้จัก
            3. กด "ติดตั้ง"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/bearapp-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
